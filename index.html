<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FFE9D6">
<title>Складай слова! 🎈</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/topbar.css">
<link rel="stylesheet" href="css/word-tiles.css">
<link rel="stylesheet" href="css/keyboard.css">
<link rel="stylesheet" href="css/celebration.css">
<link rel="stylesheet" href="css/settings.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="score-chip">Слова: <span id="score">0</span></div>
      <div class="top-actions">
        <button class="icon-btn" id="reload-btn" aria-label="Інше слово" title="Інше слово">🔄</button>
        <button class="icon-btn" id="settings-btn" aria-label="Налаштування" title="Налаштування">⚙️</button>
      </div>
    </header>

    <main class="word-area">
      <div class="visual" id="visual" aria-hidden="true"></div>
      <div class="word-prompt">Натискай літери по черзі ✨</div>
      <div class="word-display" id="word-display" aria-live="polite"></div>
    </main>

    <section class="keyboard" id="keyboard" aria-label="Клавіатура"></section>
  </div>

  <div class="celebration" id="celebration" aria-hidden="true">
    <div class="celebration-card">
      <div class="celebration-emoji">🎉</div>
      <h2>Молодець!</h2>
      <p class="celebration-word" id="celebration-word"></p>
      <button class="next-btn" id="next-btn">Далі →</button>
    </div>
  </div>

  <!-- Settings overlay -->
  <div class="settings-overlay" id="settings-overlay" aria-hidden="true">
    <div class="settings-panel" role="dialog" aria-label="Налаштування">
      <div class="settings-header">
        <h2>Налаштування</h2>
        <button class="icon-btn" id="settings-close" aria-label="Закрити" style="width:36px;height:36px;font-size:18px">✕</button>
      </div>

      <div class="tabs">
        <button class="tab active" data-tab="words">📚 Слова</button>
        <button class="tab" data-tab="images">🖼️ Картинки</button>
        <button class="tab" data-tab="prefs">⚙ Режим</button>
      </div>

      <div class="tab-content">
        <!-- WORDS TAB -->
        <div class="tab-pane active" id="pane-words">
          <div class="section-title">Лексичні теми</div>
          <div class="theme-list" id="theme-list"></div>

          <div class="section-title" style="margin-top:18px">Власні слова</div>
          <div class="hint">По одному слову в рядку. Великі/малі літери — без різниці. Дозволені літери: українська абетка (без Ґ).</div>
          <textarea class="text-input" id="custom-words-input" placeholder="МАМА&#10;ТАТО&#10;БАБУСЯ"></textarea>
          <div class="hint" id="custom-words-error" style="display:none"></div>
          <div class="item-list" id="custom-words-list" style="margin-top:10px"></div>
        </div>

        <!-- IMAGES TAB -->
        <div class="tab-pane" id="pane-images">
          <div class="section-title">Додати власну картинку</div>
          <div class="hint">Завантаж зображення та впиши слово, яке йому відповідає.</div>
          <input type="file" id="image-file" class="file-input" accept="image/*">
          <label for="image-file" class="file-label" id="image-file-label">📷 Обрати файл…</label>
          <div class="input-row" style="margin-top:10px">
            <input type="text" class="text-input" id="image-word-input" placeholder="Слово, наприклад: ВЕДМЕДИК" autocomplete="off">
            <button class="add-btn" id="image-add-btn" disabled>Додати</button>
          </div>
          <div class="hint" id="image-error" style="display:none"></div>

          <div class="section-title" style="margin-top:18px">Мої картинки</div>
          <div class="item-list" id="custom-images-list"></div>
        </div>

        <!-- PREFS TAB -->
        <div class="tab-pane" id="pane-prefs">
          <div class="section-title">Гра</div>

          <label class="toggle-row">
            <div class="toggle-label">
              <div class="t-name">Показувати літери у словах</div>
              <div class="t-desc">Якщо вимкнути, плитки будуть порожні — складніший режим</div>
            </div>
            <input type="checkbox" id="toggle-show-letters" checked>
            <div class="toggle-switch"></div>
          </label>

          <label class="toggle-row">
            <div class="toggle-label">
              <div class="t-name">Показувати картинку</div>
              <div class="t-desc">Емоджі/малюнок над словом, коли він є</div>
            </div>
            <input type="checkbox" id="toggle-show-visual" checked>
            <div class="toggle-switch"></div>
          </label>

          <label class="toggle-row">
            <div class="toggle-label">
              <div class="t-name">Підсвічувати літери</div>
              <div class="t-desc">Літери поточного слова підсвічуються, а наступна — золотим. Вимкни для складнішого режиму.</div>
            </div>
            <input type="checkbox" id="toggle-highlight-letters" checked>
            <div class="toggle-switch"></div>
          </label>

          <label class="toggle-row">
            <div class="toggle-label">
              <div class="t-name">Підсвічувати зони</div>
              <div class="t-desc">Кожен палець має свій колір — вчить сліпого друку (десятипальцевий метод).</div>
            </div>
            <input type="checkbox" id="toggle-finger-zones" checked>
            <div class="toggle-switch"></div>
          </label>

          <div class="section-title" style="margin-top:18px">Дані</div>
          <button class="danger-btn" id="reset-score-btn">Скинути лічильник</button>
        </div>
      </div>

      <div class="settings-footer">
        <button class="next-btn" id="settings-save-btn">Готово</button>
      </div>
    </div>
  </div>

  <!-- In-page confirm dialog (sibling of the settings overlay, not a child) -->
  <div class="confirm-overlay" id="confirm-overlay" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="confirm-box">
      <p class="confirm-msg" id="confirm-msg"></p>
      <div class="confirm-actions">
        <button type="button" class="confirm-cancel" id="confirm-cancel">Скасувати</button>
        <button type="button" class="confirm-ok" id="confirm-ok">Так</button>
      </div>
    </div>
  </div>

  <!-- Brief feedback toast -->
  <div class="toast" id="toast" aria-live="polite"></div>

<!-- Split into classic scripts. Load order is load-bearing: top-level const/let/function
     declarations are shared across these scripts through the one global scope. -->
<script src="js/data.js"></script>
<script src="js/state.js"></script>
<script src="js/dom.js"></script>
<script src="js/keyboard.js"></script>
<script src="js/game.js"></script>
<script src="js/input.js"></script>
<script src="js/celebration.js"></script>
<script src="js/settings.js"></script>
<script src="js/init.js"></script>
</body>
</html>
